[package]
name = "bridge-lite"
version = "0.1.0"
edition = "2024"
description = "Lightweight image viewer — a fast alternative to Adobe Bridge"

[package.metadata.bundle]
name = "bridge-lite"
identifier = "io.github.bridge-lite"
short_description = "Lightweight image viewer"
long_description = "Fast image browser with RAW support, EXIF metadata, and filter UI. A lightweight alternative to Adobe Bridge."
category = "Photography"
copyright = "2024 bridge-lite contributors"
osx_minimum_system_version = "12.0"
osx_info_plist_exts = ["macos/Info.plist.extra"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs-next = "2.0.0"
image_hasher = "3.1"
libc = "0.2"
iced = { version = "0.14.0", features = ["wgpu", "tokio", "image", "svg"] }
image = "0.25.10"
kamadak-exif = "0.6.1"
muda = "0.17"
notify = "8.2.0"
rayon = "1.11.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50.0", features = ["full"] }
walkdir = "2.5.0"
xmp_toolkit = "1.12.1"
