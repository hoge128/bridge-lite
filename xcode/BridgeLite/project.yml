name: BridgeLite

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"

options:
  bundleIdPrefix: io.github.bridge-lite
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

schemes:
  BridgeLite:
    build:
      targets:
        BridgeLite: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BridgeLiteMAS:
    build:
      targets:
        BridgeLiteMAS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BridgeLiteiOS:
    build:
      targets:
        BridgeLiteiOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BridgeLite:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BridgeLite
      - path: Generated
        optional: true
        excludes:
          - "lib/**"
          - "lib-ios/**"
          - "lib-ios-sim/**"
    settings:
      base:
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bridge-lite
        PRODUCT_NAME: BridgeLite
        SWIFT_EMIT_LOC_STRINGS: YES
        # Rust static library linked directly (run tools/build-rust-xcframework.sh first)
        OTHER_LDFLAGS: $(inherited) -lbridge_ffi -lc++
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Generated/lib
        # swift-bridge C headers exposed via bridging header
        HEADER_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Generated/include
        SWIFT_OBJC_BRIDGING_HEADER: BridgeLite/BridgeLite-Bridging-Header.h
        EXCLUDED_ARCHS: x86_64
        # Required for Apple notarization
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: BridgeLite/Resources/Info.plist
      properties:
        CFBundleName: BridgeLite
        CFBundleDisplayName: BridgeLite
        CFBundleIdentifier: io.github.bridge-lite
        CFBundleVersion: "21"
        CFBundleShortVersionString: "0.5.1"
        NSHumanReadableDescription: "Lightweight RAW+JPG image viewer"
        NSHumanReadableCopyright: "Copyright © 2026 hoge128. All rights reserved."
        # Finder の右クリック「このアプリケーションで開く」と Dock ドラッグで
        # フォルダを開けるようにするための公開ドキュメントタイプ宣言。
        # xcodegen が Info.plist を生成上書きするので、ここに含める必要がある。
        SUFeedURL: "https://hoge128.github.io/bridge-lite/appcast.xml"
        SUPublicEDKey: "aVwGOcsYTnZ/rchyd9K+ZRhph0Xy+oOtU4oa9S0ZwhI="
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: true
        LSApplicationCategoryType: "public.app-category.photography"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            # 閲覧専用ツールのため Viewer。未指定だと NSDocumentController が
            # 「CFBundleTypeRole must be Editor/Viewer/None/Shell」警告を出す。
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder

  # Mac App Store build. Same sources as BridgeLite but App-Sandboxed and with no
  # Sparkle dependency (App Store handles updates). Sparkle call sites are compiled
  # out via the APPSTORE compilation condition. Distributed via App Store Connect.
  BridgeLiteMAS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BridgeLite
        excludes:
          - "Updater/**"
          # Direct ターゲットの Info.plist。MAS の info.path は別ファイルなので、
          # これを除外しないとリソースとして .app/Contents/Resources/Info.plist に
          # コピーされ、App Store 検証で ITMS-90280 / 90261（二重バンドル）になる。
          - "Resources/Info.plist"
      - path: Generated
        optional: true
        excludes:
          - "lib/**"
          - "lib-ios/**"
          - "lib-ios-sim/**"
    entitlements:
      # xcodegen regenerates this file from these properties on every `generate`,
      # so the sandbox keys must live here (not hand-edited in the .entitlements file).
      path: BridgeLiteMAS/BridgeLiteMAS.entitlements
      properties:
        # Mac App Store build: App Sandbox is mandatory.
        com.apple.security.app-sandbox: true
        # Read/write access to folders & files the user picks via NSOpenPanel.
        com.apple.security.files.user-selected.read-write: true
        # Persist access across launches (Recents) via app-scoped security-scoped bookmarks.
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Shared with the iOS target for Universal Purchase: the Mac app joins the
        # existing iOS App Store record (one listing, one name "BridgeLite"). The two
        # bundle IDs must match EXACTLY; iOS already shipped as io.github.bridge-lite.ios
        # (immutable once created), so the Mac App Store build adopts the same id. The
        # .ios suffix is an internal identifier only — users never see it.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bridge-lite.ios
        # Must equal the iOS app's product name "BridgeLite". Under Universal Purchase
        # (same bundle id as iOS) App Store validation requires the .app/executable name
        # to match CFBundleName, otherwise upload fails with ITMS-90280 / 90261.
        # The earlier Sparkle ad-hoc-signing SIGABRT only affected interleaved local ⌘R
        # builds in the shared Build/Products dir — Archive builds are isolated per scheme
        # and the MAS target has no Sparkle dependency, so archived/uploaded builds are
        # clean. For local MAS debugging after a Direct build, do ⇧⌘K (Clean Build Folder).
        PRODUCT_NAME: BridgeLite
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: KTQ8JQW28L
        CODE_SIGN_STYLE: Automatic
        # Rust static library linked directly (run tools/build-rust-xcframework.sh first)
        OTHER_LDFLAGS: $(inherited) -lbridge_ffi -lc++
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Generated/lib
        HEADER_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Generated/include
        SWIFT_OBJC_BRIDGING_HEADER: BridgeLite/BridgeLite-Bridging-Header.h
        EXCLUDED_ARCHS: x86_64
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG APPSTORE
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    info:
      path: BridgeLiteMAS/Resources/Info.plist
      properties:
        CFBundleName: BridgeLite
        CFBundleDisplayName: BridgeLite
        CFBundleIdentifier: io.github.bridge-lite.ios
        CFBundleVersion: "3"
        CFBundleShortVersionString: "0.5.1"
        NSHumanReadableDescription: "Lightweight RAW+JPG image viewer"
        NSHumanReadableCopyright: "Copyright © 2026 Tsuyoshi Ito. All rights reserved."
        # No SU* (Sparkle) keys: Mac App Store updates are handled by the App Store.
        LSApplicationCategoryType: "public.app-category.photography"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            # 閲覧専用ツールのため Viewer。未指定だと NSDocumentController が
            # 「CFBundleTypeRole must be Editor/Viewer/None/Shell」警告を出す。
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder

  BridgeLiteiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BridgeLiteiOS
        excludes:
          - "exp-images/**"
      - path: BridgeLiteiOS/exp-images
        type: folder
      - path: Generated
        optional: true
        excludes:
          - "lib/**"
          - "lib-ios/**"
          - "lib-ios-sim/**"
      # Cross-platform Swift files shared with macOS target
      - path: BridgeLite/Pipelines/ConcurrencyLimiter.swift
      - path: BridgeLite/Pipelines/PHashPipeline.swift
      - path: BridgeLite/Pipelines/PairingPipeline.swift
      - path: BridgeLite/Pipelines/RAWRenderPipeline.swift
      - path: BridgeLite/Pipelines/ThumbnailWriteBuffer.swift
      - path: BridgeLite/Models/PhotoEntry.swift
      - path: BridgeLite/Models/ExifData.swift
      - path: BridgeLite/Models/XmpData.swift
      - path: BridgeLite/Models/ShotGroup.swift
      - path: BridgeLite/Models/ExifBucket.swift
      - path: BridgeLite/Views/ExifHistogramView.swift
      - path: BridgeLite/Models/PhotoKind.swift
      - path: BridgeLite/Bridging/BridgeCore.swift
      - path: BridgeLite/Bridging/ImageEntry+Convert.swift
      - path: BridgeLite/Bridging/CoreError+LocalizedError.swift
      - path: BridgeLite/Resources/Localizable.xcstrings
        buildPhase: resources
    entitlements:
      path: BridgeLiteiOS/BridgeLiteiOS.entitlements
    configFiles:
      Debug: BridgeLiteiOS/RustLink.xcconfig
      Release: BridgeLiteiOS/RustLink.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # 1 = iPhone, 2 = iPad. Universal app: a single binary/target runs on both,
        # sharing the same scheme, sources, and App Store record (same bundle id).
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bridge-lite.ios
        PRODUCT_NAME: BridgeLite
        DEVELOPMENT_TEAM: KTQ8JQW28L
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        # Rust static library (path selected per-SDK in RustLink.xcconfig)
        OTHER_LDFLAGS: $(inherited) -lbridge_ffi -lc++
        # swift-bridge C headers via bridging header
        HEADER_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Generated/include
        SWIFT_OBJC_BRIDGING_HEADER: BridgeLiteiOS/BridgeLiteiOS-Bridging-Header.h
    info:
      path: BridgeLiteiOS/Resources/Info.plist
      properties:
        CFBundleName: BridgeLite
        CFBundleDisplayName: BridgeLite
        CFBundleIdentifier: io.github.bridge-lite.ios
        CFBundleVersion: "6"
        CFBundleShortVersionString: "0.1.5"
        NSHumanReadableDescription: "Lightweight RAW+JPG image viewer for iPhone"
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: "Used to save exported photos to your Photo Library."
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.bridge-lite.ios.exifindex
        # iPad マルチタスク（Stage Manager / Split View）必須要件。
        # UISupportedInterfaceOrientations は iPhone 用（縦固定）、
        # ~ipad サフィックスは iPad 用（全4方向）。
        # これがないと App Store Connect アップロード時に Invalid bundle エラーになる。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
