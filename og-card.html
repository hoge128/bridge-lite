<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    color: #111110;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      linear-gradient(135deg, #f7f5f1 0%, #eceae3 55%, #e4e1d8 100%);
    overflow: hidden;
  }
  /* subtle grid like the site hero */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 79px, rgba(0,0,0,0.028) 79px 80px),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,0.028) 79px 80px);
  }

  /* ── Left text block ── */
  .left {
    position: absolute;
    left: 76px;
    top: 0;
    height: 630px;
    width: 470px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 5;
  }
  .icon {
    width: 124px;
    height: 124px;
    border-radius: 27px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    margin-bottom: 30px;
  }
  .wordmark {
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .kicker {
    margin-top: 16px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #2a2a28;
  }
  .tagline {
    margin-top: 16px;
    font-size: 25px;
    line-height: 1.5;
    color: #5f5e59;
    font-weight: 500;
  }
  .platforms {
    margin-top: 26px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #8a6f2e;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .platforms .dot { color: #c9b27a; font-weight: 400; }

  /* ── Right device cluster ── */
  .devices { position: absolute; inset: 0; z-index: 3; }
  .win-shot {
    position: absolute;
    border-radius: 13px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.10);
    background: #fff;
    box-shadow: 0 26px 70px rgba(0,0,0,0.20);
  }
  .win-shot img { display: block; width: 100%; height: auto; }
  .tag {
    position: absolute;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    color: #f7f5f1;
    background: #111110;
    padding: 7px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .tag svg { display: block; }

  .mac  { width: 608px; left: 548px; top: 84px; z-index: 2; }
  .winw { width: 436px; left: 700px; top: 298px; z-index: 3; }
  .ios  { width: 148px; left: 1022px; top: 232px; z-index: 4; border-radius: 24px; }

  .mac-tag  { left: 560px; top: 70px; }
  .winw-tag { left: 712px; top: 284px; }
  .ios-tag  { left: 1012px; top: 218px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="left">
      <img class="icon" src="src/appicon-1024.png" alt="">
      <div class="wordmark">BridgeLite</div>
      <div class="kicker">RAW + JPEG Select Viewer</div>
      <div class="tagline">撮って出し・RAW・現像済みを、<br>ひと目で。</div>
      <div class="platforms">Mac <span class="dot">·</span> Windows <span class="dot">·</span> iPhone / iPad</div>
    </div>

    <div class="devices">
      <!-- Mac -->
      <span class="tag mac-tag">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M11.2 8.5c0-1.6 1.3-2.4 1.4-2.4-0.8-1.1-1.9-1.3-2.3-1.3-1-0.1-1.9 0.6-2.4 0.6s-1.3-0.6-2.1-0.6c-1.1 0-2.1 0.6-2.6 1.6-1.1 1.9-0.3 4.8 0.8 6.3 0.5 0.8 1.2 1.6 2 1.6 0.8 0 1.1-0.5 2.1-0.5s1.2 0.5 2.1 0.5c0.9 0 1.4-0.8 1.9-1.5 0.6-0.9 0.9-1.7 0.9-1.8 0 0-1.7-0.7-1.7-2.6zM9.6 3.8c0.4-0.5 0.7-1.2 0.6-1.9-0.6 0-1.3 0.4-1.7 0.9-0.4 0.4-0.7 1.1-0.6 1.8 0.7 0 1.3-0.4 1.7-0.8z"/></svg>
        Mac
      </span>
      <div class="win-shot mac"><img src="src/mac/main-jp.webp" alt=""></div>

      <!-- Windows -->
      <span class="tag winw-tag">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M0 2.3l6.5-0.9v6.3H0V2.3zM7.3 1.3L16 0v7.6H7.3V1.3zM0 8.5h6.5v6.3L0 13.9V8.5zM7.3 8.5H16V16l-8.7-1.2V8.5z"/></svg>
        Windows
      </span>
      <div class="win-shot winw"><img src="src/win/main-jp.webp" alt=""></div>

      <!-- iPhone -->
      <span class="tag ios-tag">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="0.5" width="8" height="15" rx="2"/><rect x="5" y="2.2" width="6" height="10.2" fill="#111110"/></svg>
        iPhone
      </span>
      <div class="win-shot ios"><img src="src/ios/main-jp.webp" alt=""></div>
    </div>
  </div>
</body>
</html>
